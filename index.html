<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BRANDBALL</title>
<style>
:root{--bg:#0d0716;--pink:#ff2bd6;--cyan:#27f0ff;--yel:#ffe600;--ink:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Courier New",Courier,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#box{position:relative}
canvas{display:block;image-rendering:pixelated;border:3px solid var(--pink);box-shadow:0 0 28px #ff2bd677,inset 0 0 20px #000}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;background:rgba(13,7,22,.93);padding:14px;z-index:2;overflow:auto}
#ov h1{margin:0;font-size:40px;letter-spacing:3px;color:var(--yel);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #5a1a8a}
#ov h2{margin:0;font-size:15px;letter-spacing:3px;color:var(--cyan)}
#ov p{margin:0;font-size:13px;line-height:1.5;color:#d8c8ff;max-width:300px}
.btn{font:bold 14px "Courier New",monospace;color:#0d0716;background:var(--cyan);border:0;padding:11px 14px;width:250px;cursor:pointer;box-shadow:4px 4px 0 var(--pink);display:block;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.btn.alt{background:var(--yel)}
.btn.ghost{background:transparent;color:var(--cyan);border:2px dashed var(--cyan);box-shadow:none}
table{border-collapse:collapse;font-size:13px;width:260px}td{padding:3px 4px;text-align:left}td+td{text-align:right;color:var(--yel)}tr.t td{border-top:2px solid var(--pink);color:var(--cyan);font-weight:bold}
#sl{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:320px}
#sl b{width:24px;height:32px;border-bottom:3px solid var(--pink);font-size:22px;line-height:30px;color:var(--yel)}#sl b.f{color:var(--cyan)}
#kb{display:flex;flex-direction:column;gap:5px;align-items:center}#kb div{display:flex;gap:4px}
.k{font:bold 16px "Courier New",monospace;width:30px;height:38px;border:0;background:#2a1a4a;color:#fff;border-bottom:3px solid var(--pink)}.k:active{background:var(--pink)}.k.w{width:52px;font-size:12px}
#msg{min-height:18px;font-size:12px;color:#ff6a6a}
#cl{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:310px;overflow-y:auto;touch-action:pan-y;width:300px}
#cl button{font:12px "Courier New",monospace;padding:7px 4px;background:#1a1030;color:#6a5a8a;border:1px solid #3a2a5a}#cl .s{color:#7dff6a;border-color:#7dff6a}#cl .u{color:var(--yel);border-color:var(--yel)}
</style>
</head>
<body>
<div id="wrap"><div id="box"><canvas id="c"></canvas><div id="ov"></div></div></div>
<script>
"use strict";
const W=360,H=600,CELL=8,COLS=42,OX=12,OY=72,PY=540,PH=8;
const RUIN=0.9, FULL=0.99, LOCK=1000, TILT_RANGE=20, COMMON=4, GRAY_LIMIT=0.8;
const DIFS={EASY:{lives:5,sp:3.6,rev:.08,hide:1,gift:.28,tb:1.3},MEDIUM:{lives:3,sp:4.2,rev:.12,hide:1,gift:.2,tb:1},HARD:{lives:2,sp:5,rev:.2,hide:2,gift:.12,tb:.8}};
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;const ov=$('#ov');

/* ===== brands: placeholder marks. Brands now come from your logo folder (see Brands module)  ===== */
const DEMO="NIKE,ADIDAS,PUMA,APPLE,GOOGLE,AMAZON,NETFLIX,SPOTIFY".split(',');   /* only used when no logo folder is loaded */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function logo(n){const[c,x]=mk(168,168),h=hash(n),h1=h%360,h2=(h1+40+h%140)%360,A=`hsl(${h1},80%,50%)`,B=`hsl(${h2},85%,55%)`,s=h%5;
 x.fillStyle='#f6f4ee';x.fillRect(0,0,168,168);x.fillStyle=A;
 if(s===0){x.beginPath();x.arc(84,84,64,0,7);x.fill();x.fillStyle=B;x.beginPath();x.arc(84,84,36,0,7);x.fill()}
 else if(s===1){x.fillRect(24,24,120,120);x.fillStyle=B;x.beginPath();x.moveTo(24,144);x.lineTo(144,24);x.lineTo(144,144);x.fill()}
 else if(s===2){for(let i=0;i<5;i++){x.fillStyle=i%2?B:A;x.fillRect(20,20+i*26,128,22)}}
 else if(s===3){x.beginPath();x.moveTo(84,16);x.lineTo(152,84);x.lineTo(84,152);x.lineTo(16,84);x.fill();x.fillStyle=B;x.beginPath();x.arc(84,84,34,0,7);x.fill()}
 else{x.beginPath();x.moveTo(16,120);x.quadraticCurveTo(60,20,152,40);x.quadraticCurveTo(80,70,16,120);x.fill();x.fillStyle=B;x.fillRect(30,120,108,18)}
 x.fillStyle='#fff';x.font='bold 64px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(n[0],84,88);x.strokeStyle='#222';x.lineWidth=3;x.strokeText(n[0],84,88);return c}
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
/* ===== Brands module: the brand list is whatever is in the folder (file name = brand) ===== */
const Brands=(()=>{
 const files={},urls={},meta={};                 /* NAME -> File (picked) | url (auto from manifest) | tint colour */
 const DIRS=['logos/',''];                       /* where manifest.csv is looked for, relative to this page */
 const ras=im=>{const w=im.naturalWidth||300,h=im.naturalHeight||300,[c,x]=mk(400,Math.round(400*h/w)||400);x.drawImage(im,0,0,c.width,c.height);return c};
 const nameOf=f=>f.replace(/\.[^.]+$/,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 const okHex=h=>/^#[0-9a-f]{6}$/i.test((h||'').trim());
 const parseCsv=t=>t.split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(c=>c.length>1&&c[0].trim()).map(c=>({file:c[0].trim(),brand:(c[1]||'').trim(),color:(c[2]||'').trim(),icon:(c[4]||'').trim()}));
 const cands=r=>[...new Set([r.file,r.file.toLowerCase(),r.icon,r.icon.toLowerCase(),r.brand.toLowerCase()+'.svg',r.brand.toLowerCase().replace(/_/g,'-')+'.svg'].filter(Boolean))];   /* servers are case-sensitive: try the likely names */
 const missing={};
 const tint=(c,hex)=>{const[o,x]=mk(c.width,c.height);x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=hex;x.fillRect(0,0,o.width,o.height);return o};
 async function raster(f){let u;
  if(/\.svg$/i.test(f.name)){let t=await f.text();const m=t.match(/<svg[^>]*>/i);
   if(m&&!/\swidth=/i.test(m[0])){const vb=(m[0].match(/viewBox="([\d.\s,-]+)"/i)||[])[1],p=vb?vb.split(/[\s,]+/).map(Number):[0,0,400,400],r=p[3]/p[2]||1;t=t.replace(/<svg/i,`<svg width="400" height="${Math.round(400*r)}"`)}
   u=URL.createObjectURL(new Blob([t],{type:'image/svg+xml'}))}else u=URL.createObjectURL(f);
  const im=await loadImg(u),c=im?ras(im):null;URL.revokeObjectURL(u);return c}
 const db=()=>new Promise((res,rej)=>{const r=indexedDB.open('brandball',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const api={
  names:()=>{const k=[...new Set([...Object.keys(files),...Object.keys(urls)])];return k.length?k:DEMO},
  count:()=>api.names().length,
  has:()=>Object.keys(files).length+Object.keys(urls).length>0,
  tinted:n=>!!meta[n],
  dropped:n=>!!missing[n],
  /* AUTO: read logos/manifest.csv (filename,brand,color_hex,...) and use logos/<filename>. Needs the page served over http(s). */
  async init(){for(const base of DIRS){try{const rs=await fetch(base+'manifest.csv',{cache:'no-store'});if(!rs.ok)continue;
    const rows=parseCsv(await rs.text());let n=0;
    rows.forEach(r=>{const k=nameOf(r.brand||r.file);if(!k)return;urls[k]={base,c:cands(r)};if(okHex(r.color))meta[k]=r.color.trim();n++});
    if(n){used=[];return n}}catch(e){}}return 0},
  /* MANUAL fallback: user picks the folder (include manifest.csv to get the colours) */
  async add(list,persist){const ok=[],map={},csv=list.find(f=>/^manifest\.csv$/i.test(f.name));
   if(csv){parseCsv(await csv.text()).forEach(r=>map[r.file.toLowerCase()]=r);ok.push(csv)}
   let n=0;for(const f of list){if(!/\.(svg|png|webp|jpe?g|gif)$/i.test(f.name))continue;const r=map[f.name.toLowerCase()],k=nameOf((r&&r.brand)||f.name);if(!k)continue;files[k]=f;if(r&&okHex(r.color))meta[k]=r.color.trim();ok.push(f);n++}
   if(n){used=[];if(persist)api.save(ok)}return n},
  async image(n){let c=null;
   if(files[n])c=await raster(files[n]);
   else if(urls[n]){const u=urls[n];for(const f of u.c){try{const rs=await fetch(u.base+encodeURI(f));if(!rs.ok)continue;c=await raster(new File([await rs.blob()],f));if(c){u.c=[f];break}}catch(e){}}
    if(!c){delete urls[n];missing[n]=1}}   /* no file found: drop this brand from the list */
   return c&&meta[n]?tint(c,meta[n]):c},                  /* null -> placeholder mark */
  async save(list){try{const d=await db();d.transaction('s','readwrite').objectStore('s').put(list,'logos')}catch(e){}},
  async restore(){try{const d=await db(),fs=await new Promise(res=>{const q=d.transaction('s').objectStore('s').get('logos');q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])});return fs.length?api.add(fs,false):0}catch(e){return 0}}
 };return api})();

/* ===== state ===== */
let sv={diff:'MEDIUM',done:{},snd:1};try{sv={...sv,...JSON.parse(localStorage.getItem('brandball')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('brandball',JSON.stringify(sv))}catch(e){}};
const DIF=()=>DIFS[sv.diff];
let LV=0,lives=3,score=0,rows=0,grid=[],balls=[],drops=[],bullets=[],gunCd=0,fx=[],msgs=[],mode='menu',pm='play',useTilt=false,total=0,broken=0;
let B=null,solved=false,guessLock=0,tSec=0,guessBonus=0,lvBricks=0,used=[],back=null,gs=null,customImg=null;
const pad={x:W/2,w:64,tx:W/2},timers={wide:0,slow:0,fire:0,gun:0},keys={l:0,r:0};
let calibT=0,calibS=[];const tilt={cur:0,f:0,base:0,got:false};

/* ===== audio ===== */
let ac;function beep(f,d){if(!sv.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ===== level building ===== */
async function buildLevel(name,custom){
 let img=custom?customImg:await Brands.image(name);if(!img&&!custom&&Brands.dropped(name)){used=used.filter(x=>x!==name);return nextBrand()}if(!img)img=logo(name);
 const rws=Math.max(8,Math.min(50,Math.round(COLS*img.height/img.width)));
 const[,x]=mk(COLS,rws);x.drawImage(img,0,0,COLS,rws);const d=x.getImageData(0,0,COLS,rws).data;
 rows=rws;grid=[];let grays=0;const cnt={};
 for(let k=0;k<COLS*rws;k++){const r=d[k*4],g=d[k*4+1],b=d[k*4+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),av=(r+g+b)/3;
  const empty=d[k*4+3]<128||(mn>215&&mx-mn<28),gray=!empty&&mx-mn<22&&av>50&&av<210;if(gray)grays++;
  grid.push({x:OX+(k%COLS)*CELL,y:OY+Math.floor(k/COLS)*CELL,c:`rgb(${r},${g},${b})`,k:(r>>5)+','+(g>>5)+','+(b>>5),gray,alive:!empty,t:0,gift:false,rgb:[r,g,b]})}
 const tinted=Brands.tinted(name),walls=!tinted&&grays/grid.length<GRAY_LIMIT;   /* single-colour logos: no gray walls */
 grid.forEach(q=>{if(!q.alive)return;if(q.gray&&walls)q.t=2;else cnt[q.k]=(cnt[q.k]||0)+1});
 const common=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,COMMON).map(e=>e[0]);
 grid.forEach(q=>{if(q.t!==2){q.t=common.includes(q.k)?0:1;q.gift=q.t===1&&Math.random()<DIF().gift}});
 {const al=grid.filter(q=>q.alive&&q.t===0),rare=grid.filter(q=>q.alive&&q.t===1).length,need=Math.ceil(grid.filter(q=>q.alive&&q.t!==2).length*.08)-rare;if(need>0)al.sort(()=>Math.random()-.5).slice(0,need).forEach(q=>{q.t=1;q.gift=Math.random()<DIF().gift})}
 if(tinted)grid.forEach(q=>{if(q.alive&&q.t===1)q.c='rgb('+q.rgb.map(v=>Math.round(v+(255-v)*.45)).join()+')'});   /* rare bricks a bit lighter */
 total=grid.filter(q=>q.alive&&q.t!==2).length;broken=0;
 const order=[...Array(name.length).keys()].sort(()=>Math.random()-.5);
 B={name,img,custom,order};solved=!!custom;guessLock=0;tSec=0;guessBonus=0;lvBricks=0;
 drops=[];bullets=[];fx=[];timers.wide=timers.slow=timers.fire=timers.gun=0;pad.w=64;resetBall();mode='ready'}
function baseSpeed(){return Math.min(7,DIF().sp+Math.min(LV*.25,2))}
function resetBall(){balls=[{x:pad.x,y:PY-5,vx:0,vy:0,r:5,stuck:true,fire:false}]}
function launch(){if(mode!=='ready')return;const b=balls[0];b.stuck=false;const a=(Math.random()-.5)*.6;b.vx=Math.sin(a)*baseSpeed();b.vy=-Math.cos(a)*baseSpeed();mode='play';beep(520,.06)}

/* ===== collisions ===== */
function cellAt(px,py){const c=Math.floor((px-OX)/CELL),r=Math.floor((py-OY)/CELL);if(c<0||r<0||c>=COLS||r>=rows)return -1;const i=r*COLS+c;return grid[i].alive?i:-1}
const target=()=>solved?RUIN:FULL;
function hit(i){if(mode==='win')return;const q=grid[i];if(q.t===2){beep(140,.05);return}
 q.alive=false;broken++;const p=q.t?50:10;score+=p;lvBricks+=p;beep(q.t?680:330,.04);
 for(let k=0;k<2;k++)fx.push({x:q.x+4,y:q.y+4,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,l:22,c:q.c});
 if(q.gift)drops.push({x:q.x+4,y:q.y+4,k:pick()});
 if(broken>=total*target())winLevel(false)}
function pick(){const t=['W','W','W','M','M','S','S','F','F','L','G','G','G'];return t[Math.floor(Math.random()*t.length)]}
function stepBall(b,dt){
 b.x+=b.vx*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
 let i=cellAt(b.x+Math.sign(b.vx)*b.r,b.y);if(i>=0){const t=grid[i].t;hit(i);if(!(b.fire&&t!==2)){b.x-=b.vx*dt;b.vx*=-1}}
 b.y+=b.vy*dt;if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
 i=cellAt(b.x,b.y+Math.sign(b.vy)*b.r);if(i>=0){const t=grid[i].t;hit(i);if(!(b.fire&&t!==2)){b.y-=b.vy*dt;b.vy*=-1}}
 if(b.vy>0&&b.y+b.r>=PY&&b.y+b.r<=PY+PH+8&&Math.abs(b.x-pad.x)<pad.w/2+b.r){
  const sp=Math.hypot(b.vx,b.vy),a=Math.max(-1,Math.min(1,(b.x-pad.x)/(pad.w/2)));
  b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;b.y=PY-b.r;beep(260,.03)}}

/* ===== power-ups ===== */
const PU={W:['#27f0ff','WIDE'],M:['#ff2bd6','MULTI'],S:['#7dff6a','SLOW'],F:['#ff8a1a','FIRE'],L:['#ffe600','+LIFE'],G:['#ff3b3b','GUN']};
function applyPU(k){msgs.push({t:PU[k][1]+'!',l:60,c:PU[k][0]});beep(880,.12);
 if(k==='W')timers.wide=12;if(k==='G')timers.gun=10;if(k==='S')timers.slow=10;if(k==='F')timers.fire=8;
 if(k==='L')lives=Math.min(6,lives+1);
 if(k==='M'){const add=[];balls.forEach(b=>{if(b.stuck||balls.length+add.length>=8)return;[.5,-.5].forEach(a=>{const c=Math.cos(a),s=Math.sin(a);add.push({...b,vx:b.vx*c-b.vy*s,vy:b.vx*s+b.vy*c})})});balls=balls.concat(add)}}

/* ===== overlay / actions ===== */
function show(h){ov.innerHTML=h;ov.style.display='flex'}function hide(){ov.style.display='none'}
const act={};
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a]){beep(500,.02);act[b.dataset.a](b.dataset)}});
const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function pauseGame(){if(mode==='play'||mode==='ready'){pm=mode;mode='pause'}}
function resumeGame(){hide();if(mode==='pause')mode=pm}

function home(){mode='menu';B=null;back=home;
 show(`<h1>BRAND<br>BALL</h1><p>Smash the pixels. Guess the brand.</p>${logosChecked?`<p style="font-size:11px;color:${Brands.has()?'#7dff6a':'#ffe600'}">${Brands.has()?Brands.count()+' logos loaded':'⚠ logos/manifest.csv not found – demo brands. Open via http://, not file://'}</p>`:''}
 <button class="btn alt" data-a="dif">DIFFICULTY: ${sv.diff}</button>
 <button class="btn" data-a="tilt">▶ PLAY WITH TILT</button>
 <button class="btn" data-a="touch">▶ PLAY WITH TOUCH / MOUSE</button>
 <button class="btn alt" data-a="coll">🏆 COLLECTION (${found()}/${Brands.count()})</button>
 ${logosChecked&&!Brands.has()?`<label class="btn ghost">📁 PICK LOGO FOLDER<input type="file" accept=".svg,.csv,image/*" id="lf" multiple webkitdirectory hidden></label>`:''}
 <label class="btn ghost">＋ PLAY YOUR OWN IMAGE<input type="file" accept="image/*" id="f" hidden></label>`);
 {const lf=$('#lf');if(lf)lf.onchange=async e=>{await Brands.add([...e.target.files],true);home()}}
 $('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{customImg=im;hide();LV=0;lives=DIF().lives;score=0;buildLevel('YOUR IMAGE',true)};im.src=URL.createObjectURL(f)}}
const found=()=>Brands.names().filter(n=>sv.done[n]!==undefined).length;
act.dif=()=>{const k=Object.keys(DIFS);sv.diff=k[(k.indexOf(sv.diff)+1)%3];save();home()};
act.touch=()=>gate(false);function doTouch(){useTilt=false;newRun()}
act.tilt=()=>gate(true);async function doTilt(){beep(1,.01);let ok=false;try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){ok=(await DeviceOrientationEvent.requestPermission())==='granted'}else ok=true;if(ok)addEventListener('deviceorientation',onOri)}catch(e){ok=false}
 hide();if(!ok){useTilt=false;newRun();msgs.push({t:'Tilt denied – touch mode',l:150,c:'#ffe600'});return}
 mode='calib';calibT=3.2;calibS=[];tilt.got=false};
function newRun(){LV=0;score=0;lives=DIF().lives;used=[];hide();nextBrand()}
function nextBrand(){let pool=Brands.names().filter(n=>!used.includes(n));if(!pool.length){used=[];pool=Brands.names()}
 const n=pool[Math.floor(Math.random()*pool.length)];used.push(n);hide();buildLevel(n,false)}
act.pause=()=>{};
function openPause(){if(mode!=='play'&&mode!=='ready')return;pauseGame();back=openPause;
 show(`<h2>PAUSED</h2><p>${sv.diff} · LV${LV+1}</p>
 <button class="btn" data-a="res">▶ RESUME</button>
 <button class="btn alt" data-a="coll">🏆 COLLECTION (${found()}/${Brands.count()})</button>
 <button class="btn alt" data-a="snd">SOUND: ${sv.snd?'ON':'OFF'}</button>
 <button class="btn ghost" data-a="home">⌂ BACK TO SETTINGS / HOME</button>`)}
act.res=resumeGame;act.home=home;act.snd=()=>{sv.snd=sv.snd?0:1;save();openPause2()};
function openPause2(){mode='pause';openPauseRaw()}
function openPauseRaw(){show(`<h2>PAUSED</h2><p>${sv.diff} · LV${LV+1}</p>
 <button class="btn" data-a="res">▶ RESUME</button>
 <button class="btn alt" data-a="coll">🏆 COLLECTION (${found()}/${Brands.count()})</button>
 <button class="btn alt" data-a="snd">SOUND: ${sv.snd?'ON':'OFF'}</button>
 <button class="btn ghost" data-a="home">⌂ BACK TO SETTINGS / HOME</button>`)}
function coll(){show(`<h2>COLLECTION ${found()}/${Brands.count()}</h2><p>★ guessed · ? cleared, guess it now · ••• not met yet</p><div id="cl">`+
 Brands.names().map(n=>{const d=sv.done[n];return d===1?`<button class="s">★ ${n}</button>`:d===0?`<button class="u" data-a="late" data-n="${n}">? ${n[0]}${'_'.repeat(n.length-1)}</button>`:`<button>•••</button>`}).join('')+
 `</div><button class="btn ghost" data-a="bk">← BACK</button>`)}
act.coll=coll;act.bk=()=>{back===openPause?openPauseRaw():home()};
/* first Play: ask for the logo folder once, remember it on this device */
let wantTilt=false,skipped=0,logosChecked=false;
async function gate(t){wantTilt=t;await Brands.ready;if(!Brands.has())msgs.push({t:'logos/manifest.csv not found – demo brands',l:200,c:'#ffe600'});go()}
function go(){wantTilt?doTilt():doTouch()}
act.go=go;act.skiplogo=()=>{skipped=1;go()};
act.late=d=>openGuess(d.n,[0],true);

/* ===== guess panel ===== */
const revSet=()=>{if(!B||B.custom)return new Set();if(solved)return new Set(B.order);const n=Math.min(B.name.length-DIF().hide,Math.floor(broken/total/DIF().rev));return new Set(B.order.slice(0,Math.max(0,n)))};
function tryGuess(){if(!B||B.custom||solved||(mode!=='play'&&mode!=='ready'))return;
 if(score<guessLock){msgs.push({t:`NEED ${guessLock-score} MORE PTS`,l:90,c:'#ff6a6a'});return}
 pauseGame();openGuess(B.name,[...revSet()],false)}
function openGuess(name,rev,st){gs={name,rev:new Set(rev),st,ty:[]};
 const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
 show(`<h2>WHICH BRAND?</h2><div id="sl"></div><div id="msg"></div><div id="kb">`+rows.map((r,i)=>`<div>${r.split('').map(l=>`<button class="k" data-a="key" data-l="${l}">${l}</button>`).join('')}${i==2?'<button class="k w" data-a="del">⌫</button>':''}</div>`).join('')+
 `</div><button class="btn" data-a="sub">GUESS</button><button class="btn ghost" data-a="gx">CANCEL</button>`);gRender()}
function gSlots(){return gs.name.split('').map((c,i)=>i)}
function gRender(){let k=0;$('#sl').innerHTML=gs.name.split('').map((c,i)=>gs.rev.has(i)?`<b class="f">${c}</b>`:`<b>${gs.ty[k++]||''}</b>`).join('')}
const gNeed=()=>gs.name.length-gs.rev.size;
act.key=d=>{if(gs.ty.length<gNeed()){gs.ty.push(d.l);gRender()}};
act.del=()=>{gs.ty.pop();gRender()};
act.gx=()=>{if(gs.st)coll();else resumeGame()};
act.sub=()=>{if(gs.ty.length<gNeed()){$('#msg').textContent='Fill every blank first';return}
 let k=0;const g=gs.name.split('').map((c,i)=>gs.rev.has(i)?c:gs.ty[k++]).join('');
 if(g===gs.name){beep(990,.2);
  if(gs.st){sv.done[gs.name]=1;save();score+=300;coll();return}
  solved=true;guessBonus=Math.round(Math.max(300,3000-tSec*30)*DIF().tb);score+=guessBonus;sv.done[gs.name]=1;save();
  show(`<h1 style="font-size:28px">${gs.name}</h1><p>Correct! Found in ${mm(tSec)}</p><p>+${guessBonus} time bonus</p>
  <button class="btn" data-a="keep">KEEP BREAKING (to 90%)</button><button class="btn alt" data-a="skip">NEXT LEVEL →</button>`)}
 else{beep(120,.3);if(gs.st){gs.ty=[];gRender();$('#msg').textContent='Wrong – try again';return}
  guessLock=score+LOCK;msgs.push({t:`WRONG! +${LOCK} PTS TO RETRY`,l:150,c:'#ff6a6a'});resumeGame()}};
act.keep=()=>{resumeGame();if(broken>=total*RUIN)winLevel(false)};
act.skip=()=>winLevel(true);
addEventListener('keydown',e=>{
 if(ov.style.display==='flex'&&gs&&$('#sl')){if(/^[a-z]$/i.test(e.key))act.key({l:e.key.toUpperCase()});if(e.key==='Backspace')act.del();if(e.key==='Enter')act.sub();return}
 if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key===' ')launch()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});

/* ===== flow ===== */
function winLevel(skipped){if(mode==='win')return;mode='win';
 const clear=(skipped||B.custom)?0:Math.round(Math.max(0,2000-tSec*20)*DIF().tb),lf=B.custom?0:lives*300;
 score+=clear+lf;if(!solved&&!B.custom){sv.done[B.name]=sv.done[B.name]??0;save()}
 const nm=solved?B.name:'??? (guess it in Collection)';
 show(`<h2>${B.custom?'YOUR IMAGE':'LEVEL '+(LV+1)+' CLEARED'}</h2><h1 style="font-size:26px">${B.custom?'NICE ART':nm}</h1>
 <table><tr><td>Bricks</td><td>${lvBricks}</td></tr><tr><td>Brand time (${solved?mm(tSec):'–'})</td><td>${guessBonus}</td></tr>
 <tr><td>Clear time bonus</td><td>${clear}</td></tr><tr><td>Lives ♥×${lives}</td><td>${lf}</td></tr><tr class="t"><td>TOTAL</td><td>${score}</td></tr></table>`+
 (B.custom?`<button class="btn" data-a="home">⌂ HOME</button>`:`<button class="btn" data-a="nx">NEXT BRAND →</button><button class="btn ghost" data-a="home">⌂ HOME</button>`))}
act.nx=()=>{LV++;nextBrand()};
function gameOver(){mode='over';show(`<h1 style="font-size:32px">GAME OVER</h1><p>Score ${score}<br>You ruined ${Math.round(broken/total*100)}% of it.</p><button class="btn" data-a="again">TRY AGAIN</button><button class="btn ghost" data-a="home">⌂ HOME</button>`)}
act.again=()=>{if(B&&B.custom){LV=0;lives=DIF().lives;score=0;hide();buildLevel('YOUR IMAGE',true)}else newRun()};

/* ===== tilt ===== */
function onOri(e){const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
 const v=a===90?e.beta:(a===270||a===-90)?-e.beta:a===180?-e.gamma:e.gamma;if(v==null)return;tilt.cur=v;tilt.got=true}

/* ===== input ===== */
function toXY(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointermove',e=>{if(useTilt||mode==='menu'||mode==='calib')return;pad.tx=toXY(e)[0]});
cv.addEventListener('pointerdown',e=>{const[x,y]=toXY(e);
 if(y<38&&x<70){openPause();return}
 if(y>=38&&y<OY){tryGuess();return}
 if(!useTilt&&mode!=='menu'&&mode!=='calib')pad.tx=x;if(mode==='ready')launch()});

/* ===== update ===== */
function update(dt){
 if(mode==='calib'){calibT-=dt/60;if(tilt.got&&calibT<2.6)calibS.push(tilt.cur);
  if(calibT<=0){if(calibS.length>8){tilt.base=calibS.reduce((a,b)=>a+b,0)/calibS.length;tilt.f=tilt.base;useTilt=true;newRun()}
   else{useTilt=false;newRun();msgs.push({t:'No tilt sensor – touch mode',l:150,c:'#ffe600'})}}return}
 if(mode!=='ready'&&mode!=='play')return;
 if(mode==='play')tSec+=dt/60;
 if(useTilt){tilt.f+=(tilt.cur-tilt.f)*Math.min(1,.35*dt);pad.tx=W/2+Math.max(-1,Math.min(1,(tilt.f-tilt.base)/TILT_RANGE))*(W/2)}
 pad.tx+=(keys.r-keys.l)*8*dt;
 pad.w+=((timers.wide>0?104:64)-pad.w)*.15*dt;
 pad.x+=(pad.tx-pad.x)*Math.min(1,.35*dt);pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,pad.x));
 for(const k in timers)if(timers[k]>0)timers[k]-=dt/60;
 if(timers.gun>0&&mode==='play'){gunCd-=dt;if(gunCd<=0){gunCd=14;bullets.push({x:pad.x-pad.w/2+4,y:PY},{x:pad.x+pad.w/2-4,y:PY});beep(1200,.02)}}
 bullets.forEach(u=>{for(let n=0;n<3&&!u.dead;n++){u.y-=3*dt;const i=cellAt(u.x,u.y);if(i>=0){hit(i);u.dead=true}if(u.y<0)u.dead=true}});bullets=bullets.filter(u=>!u.dead);
 const sp=baseSpeed()*(timers.slow>0?.7:1);
 balls.forEach(b=>{b.fire=timers.fire>0;if(b.stuck){b.x=pad.x;b.y=PY-5;return}
  const s=Math.hypot(b.vx,b.vy)||1;b.vx*=sp/s;b.vy*=sp/s;for(let n=0;n<2;n++)stepBall(b,dt/2)});
 if(mode!=='play'&&mode!=='ready')return;
 balls=balls.filter(b=>b.y<H+10);
 if(!balls.length&&mode==='play'){lives--;beep(90,.3);if(lives<=0)return gameOver();resetBall();mode='ready'}
 drops.forEach(d=>{d.y+=2.2*dt;if(d.y>PY-4&&d.y<PY+PH+4&&Math.abs(d.x-pad.x)<pad.w/2+9){d.dead=true;applyPU(d.k)}if(d.y>H)d.dead=true});
 drops=drops.filter(d=>!d.dead);
 fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});fx=fx.filter(p=>p.l>0);
 msgs.forEach(m=>m.l-=dt);msgs=msgs.filter(m=>m.l>0)}

/* ===== render ===== */
const txt=(s,x,y,c,sz=11,al='left')=>{ctx.fillStyle=c;ctx.font=`bold ${sz}px "Courier New",monospace`;ctx.textAlign=al;ctx.fillText(s,x,y)};
function draw(t){
 ctx.fillStyle='#0d0716';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#1a1030';for(let x=0;x<W;x+=24)ctx.fillRect(x,0,1,H);for(let y=0;y<H;y+=24)ctx.fillRect(0,y,W,1);
 if(mode==='calib'){txt('HOLD YOUR PHONE',W/2,230,'#27f0ff',20,'center');txt('the way you will play',W/2,256,'#d8c8ff',14,'center');
  txt(Math.max(0,Math.ceil(calibT)),W/2,340,'#ffe600',72,'center');txt(calibT>2.6?'get comfortable…':'calibrating – keep still',W/2,380,'#ff2bd6',14,'center');return}
 if(!B)return;
 txt('☰ MENU',OX,16,'#ff2bd6',11);txt(`LV${LV+1} ${sv.diff}`,W/2,16,'#27f0ff',10,'center');txt('♥'.repeat(lives),W-OX,16,'#ff2bd6',12,'right');
 txt(`SCORE ${score}`,OX,32,'#ffe600',10);txt(`⏱ ${mm(tSec)}`,W/2,32,'#fff',10,'center');txt(`${Math.round(broken/total*100)}% / ${Math.round(target()*100)}%`,W-OX,32,'#7dff6a',10,'right');
 ctx.fillStyle='#241a3d';ctx.fillRect(OX,OY,COLS*CELL,rows*CELL);ctx.drawImage(B.img,OX,OY,COLS*CELL,rows*CELL);   /* the real image behind the pixels */
 for(const q of grid){if(!q.alive)continue;
  if(q.t===2){ctx.fillStyle='#6b6b78';ctx.fillRect(q.x,q.y,CELL,CELL);ctx.fillStyle='#a4a4b2';ctx.fillRect(q.x,q.y,CELL,1);ctx.fillRect(q.x,q.y,1,CELL);ctx.fillStyle='#3a3a46';ctx.fillRect(q.x+2,q.y+2,CELL-4,CELL-4);continue}
  ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,CELL,CELL);
  ctx.strokeStyle='rgba(13,7,22,.6)';ctx.lineWidth=1;ctx.strokeRect(q.x+.5,q.y+.5,CELL-1,CELL-1);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(q.x+1,q.y+1,CELL-2,1);ctx.fillRect(q.x+1,q.y+1,1,CELL-2);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(q.x+1,q.y+CELL-2,CELL-2,1);ctx.fillRect(q.x+CELL-2,q.y+1,1,CELL-2);
  if(q.gift){const on=((t/250)|0)%2===0;ctx.strokeStyle=on?'#ff2bd6':'#27f0ff';ctx.lineWidth=2;ctx.strokeRect(q.x+1,q.y+1,CELL-2,CELL-2);ctx.fillStyle='#0d0716';ctx.fillRect(q.x+2,q.y+2,CELL-4,CELL-4);ctx.fillStyle='#fff';ctx.fillRect(q.x+3,q.y+3,2,2)}}
 fx.forEach(p=>{ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.l/12);ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
 drops.forEach(d=>{ctx.fillStyle='#fff';ctx.fillRect(d.x-12,d.y-8,24,16);ctx.fillStyle=PU[d.k][0];ctx.fillRect(d.x-11,d.y-7,22,14);ctx.fillStyle='#0d0716';ctx.fillRect(d.x-8,d.y-4,16,8);txt(d.k,d.x,d.y+4,PU[d.k][0],11,'center')});
 ctx.fillStyle='#ff6a6a';bullets.forEach(u=>ctx.fillRect(u.x-1,u.y-6,2,8));
 const pg=ctx.createLinearGradient(0,PY,0,PY+PH);pg.addColorStop(0,'#fff');pg.addColorStop(.4,'#27f0ff');pg.addColorStop(1,'#ff2bd6');
 ctx.fillStyle=pg;ctx.fillRect(pad.x-pad.w/2,PY,pad.w,PH);
 if(timers.gun>0){ctx.fillStyle='#ff3b3b';ctx.fillRect(pad.x-pad.w/2,PY-5,4,5);ctx.fillRect(pad.x+pad.w/2-4,PY-5,4,5)}
 balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r+1.5,0,7);ctx.fillStyle='#0d0716';ctx.fill();ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle=b.fire?'#ff8a1a':'#ff2bd6';ctx.fill();ctx.beginPath();ctx.arc(b.x-1.5,b.y-1.5,b.r*.4,0,7);ctx.fillStyle=b.fire?'#ffe600':'#fff';ctx.fill()});
 if(mode==='ready')txt(useTilt?'TAP TO LAUNCH · TILT TO MOVE':'TAP TO LAUNCH',W/2,PY-40,'#ffe600',12,'center');
 /* word bar */
 if(B.custom)txt('YOUR IMAGE – no guessing',W/2,62,'#6a5a8a',11,'center');
 else{const rv=revSet(),L=B.name.length,w=20,x0=W/2-L*w/2+w/2;
  for(let i=0;i<L;i++)txt(solved||rv.has(i)?B.name[i]:'_',x0+i*w,64,solved?'#7dff6a':rv.has(i)?'#27f0ff':'#ff2bd6',18,'center');
  txt(solved?'BRAND FOUND':score<guessLock?`LOCKED · +${guessLock-score} PTS`:'TAP THE WORD TO GUESS',W/2,50,solved?'#7dff6a':score<guessLock?'#ff6a6a':'#6a5a8a',9,'center')}
 const m=msgs[msgs.length-1];if(m)txt(m.t,W/2,PY-70,m.c,15,'center');
 if(timers.wide>0||timers.slow>0||timers.fire>0||timers.gun>0){let s='';if(timers.wide>0)s+='W ';if(timers.slow>0)s+='S ';if(timers.fire>0)s+='F ';if(timers.gun>0)s+='G';txt(s,OX,PY-12,'#7dff6a',10)}}

/* ===== main loop ===== */
function fit(){const s=Math.min(innerWidth/(W+6),innerHeight/(H+6));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();
let last=performance.now();
(function loop(now){const dt=Math.min(2.5,(now-last)/16.667);last=now;update(dt);draw(now);requestAnimationFrame(loop)})(last);
home();
Brands.ready=Brands.init().then(n=>n||Brands.restore()).then(n=>{logosChecked=true;if(mode==='menu')home();return n});
</script>
</body>
</html>
